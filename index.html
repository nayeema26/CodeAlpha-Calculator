<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calc">
    <div class="calc-screen">
      <div class="history" id="history">&nbsp;</div>
      <div class="display" id="display">0</div>
    </div>

    <div class="keys">
      <button class="key op-clear" data-action="clear">C</button>
      <button class="key op-clear" data-action="delete">DEL</button>
      <button class="key op-func" data-action="percent">%</button>
      <button class="key op-accent" data-value="÷">÷</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key op-accent" data-value="×">×</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key op-accent" data-value="−">−</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key op-accent" data-value="+">+</button>

      <button class="key key-wide" data-value="0">0</button>
      <button class="key" data-value=".">.</button>
      <button class="key op-equals" data-action="equals">=</button>
    </div>
    <p class="hint">Keyboard works too — numbers, + − * /, Enter, Backspace, Esc</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
